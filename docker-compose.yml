version: "3.8"

services:
  # PHP-FPM サービス
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movieticket_php
    volumes:
      - .:/var/www/html
      - ./upload:/var/www/html/upload
    networks:
      - movieticket_network
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_NAME=portfolio
      - DB_USER=root
      - DB_PASS=rootpassword

  # Nginx Webサーバー
  nginx:
    image: nginx:1.25-alpine
    container_name: movieticket_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./upload:/var/www/html/upload
    networks:
      - movieticket_network
    depends_on:
      - php

  # MySQL データベース
  mysql:
    image: mysql:8.0
    container_name: movieticket_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: portfolio
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./portfolio.sql:/docker-entrypoint-initdb.d/portfolio.sql
    networks:
      - movieticket_network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootpassword",
        ]
      timeout: 20s
      retries: 10

  # phpMyAdmin (開発用)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    container_name: movieticket_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    ports:
      - "8081:80"
    networks:
      - movieticket_network
    depends_on:
      - mysql

networks:
  movieticket_network:
    driver: bridge

volumes:
  mysql_data:
